<!-- app/templates/incidents/new.html -->
{% extends "base.html" %}

{% block title %}Ново произшествие | ГДПБЗН{% endblock %}

{% block content %}
<div class="container" style="padding: 40px 0;">
    <a href="{{ url_for('incidents.dashboard') }}" class="btn btn-secondary" style="margin-bottom: 20px;">
        <i class="fas fa-arrow-left"></i> Назад към произшествията
    </a>

    <h1 style="font-family: 'Bebas Neue', sans-serif; font-size: 36px; margin-bottom: 10px;">Ново произшествие</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Регистрирайте ново произшествие в системата</p>

    <div style="background: var(--dark-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 30px;">
        <form method="POST" id="incidentForm">
            <!-- Incident Type -->
            <div style="margin-bottom: 20px;">
                <label for="type" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Тип произшествие *</label>
                <select id="type" name="type" required style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light);">
                    <option value="">Изберете тип</option>
                    <option value="fire">Пожар</option>
                    <option value="rescue">Спасителна операция</option>
                    <option value="flood">Наводнение</option>
                    <option value="earthquake">Земетресение</option>
                    <option value="hazmat">Опасни материали</option>
                    <option value="road_accident">Пътнотранспортно произшествие</option>
                    <option value="industrial">Промишлена авария</option>
                    <option value="other">Друго</option>
                </select>
            </div>

            <!-- Priority -->
            <div style="margin-bottom: 20px;">
                <label for="priority" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Приоритет *</label>
                <select id="priority" name="priority" required style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light);">
                    <option value="1">1 - Нисък</option>
                    <option value="2">2 - Среден</option>
                    <option value="3" selected>3 - Висок</option>
                    <option value="4">4 - Много висок</option>
                    <option value="5">5 - Критичен</option>
                </select>
            </div>

            <!-- Address -->
            <div style="margin-bottom: 20px;">
                <label for="address" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Адрес *</label>
                <input type="text" id="address" name="address" required placeholder="Напр. ул. Цар Борис III 47, София" style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light);">
            </div>

            <!-- GPS Coordinates -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label for="latitude" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Географска ширина *</label>
                    <input type="number" id="latitude" name="latitude" step="0.00000001" required placeholder="42.6977" style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light);">
                </div>
                <div>
                    <label for="longitude" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Географска дължина *</label>
                    <input type="number" id="longitude" name="longitude" step="0.00000001" required placeholder="23.3219" style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light);">
                </div>
            </div>

            <!-- Reporter Info -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label for="reporter_name" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Име на докладвалия</label>
                    <input type="text" id="reporter_name" name="reporter_name" placeholder="Име на лицето" style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light);">
                </div>
                <div>
                    <label for="reporter_phone" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Телефон за връзка</label>
                    <input type="tel" id="reporter_phone" name="reporter_phone" placeholder="0888 123 456" style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light);">
                </div>
            </div>

            <!-- Description -->
            <div style="margin-bottom: 20px;">
                <label for="description" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Описание</label>
                <textarea id="description" name="description" rows="4" placeholder="Подробно описание на ситуацията..." style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light); resize: vertical;"></textarea>
            </div>

            <!-- Hazardous Materials -->
            <div style="margin-bottom: 20px;">
                <label for="hazardous_materials" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Опасни вещества</label>
                <textarea id="hazardous_materials" name="hazardous_materials" rows="3" placeholder="Идентифицирани опасни материали на място..." style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light); resize: vertical;"></textarea>
            </div>

            <!-- Action Plan -->
            <div style="margin-bottom: 20px;">
                <label for="action_plan" style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">План за действие</label>
                <textarea id="action_plan" name="action_plan" rows="3" placeholder="Предварителен план за действие..." style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light); resize: vertical;"></textarea>
            </div>

            <!-- Dispatch Options -->
            <div style="background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 20px; margin-bottom: 20px;">
                <h4 style="color: var(--text-muted); margin-bottom: 15px;">Разпределение</h4>

                <div style="margin-bottom: 15px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="dispatch_now" name="dispatch_now" value="1" onchange="toggleTeamSelection()">
                        <span style="color: var(--text-light);">Изпрати екип веднага</span>
                    </label>
                </div>

                <div id="teamSelection" style="display: none;">
                    <label style="display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 500;">Изберете екипи</label>
                    <select id="team_ids" name="team_ids" multiple style="width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-light); min-height: 100px;">
                        {% for team in teams %}
                            <option value="{{ team.id }}">{{ team.name }} ({{ team.status }}) - {{ team.station or 'Няма станция' }}</option>
                        {% endfor %}
                    </select>
                    <p style="color: var(--text-muted); font-size: 12px; margin-top: 5px;">Задръжте Ctrl/Cmd за избор на няколко екипа</p>
                </div>
            </div>

            <!-- Submit -->
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1; padding: 14px; font-size: 16px;">
                    <i class="fas fa-save"></i> Създай произшествие
                </button>
                <a href="{{ url_for('incidents.dashboard') }}" class="btn btn-secondary" style="flex: 1; justify-content: center; padding: 14px;">
                    Отказ
                </a>
            </div>
        </form>
    </div>
</div>

<script>
function toggleTeamSelection() {
    const checked = document.getElementById('dispatch_now').checked;
    document.getElementById('teamSelection').style.display = checked ? 'block' : 'none';
}

// Auto-fill coordinates if browser supports geolocation
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
        document.getElementById('latitude').value = position.coords.latitude;
        document.getElementById('longitude').value = position.coords.longitude;
    }, function() {
        // User denied or error - use default Bulgaria center
        document.getElementById('latitude').value = 42.6977;
        document.getElementById('longitude').value = 23.3219;
    });
}
</script>
{% endblock %}
